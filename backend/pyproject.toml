[project]
name = "enterprise-mcp-gateway-demo"
version = "0.1.0"
description = "Database-configured enterprise MCP Gateway demo"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46,<47",
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "mcp>=2.2,<3",
    "pydantic-settings>=2.11,<3",
    "sqlalchemy>=2.0.40,<3",
    "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

